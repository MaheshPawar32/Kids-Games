<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Adventure Island</title>
<desc id="desc">A magical floating green island with a tiny pastel castle, rounded trees, sparkling water and layered rocky sides in a glossy storybook 3D style.</desc>
<defs>
  <linearGradient id="skyCloud" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFF"/><stop offset="1" stop-color="#CDEBFF"/></linearGradient>
  <linearGradient id="grass" x1="110" y1="155" x2="405" y2="352" gradientUnits="userSpaceOnUse"><stop stop-color="#B6F29B"/><stop offset=".38" stop-color="#6EDB9F"/><stop offset=".78" stop-color="#35B987"/><stop offset="1" stop-color="#208C75"/></linearGradient>
  <linearGradient id="soil" x1="115" y1="285" x2="403" y2="479" gradientUnits="userSpaceOnUse"><stop stop-color="#D99A6A"/><stop offset=".36" stop-color="#B9765A"/><stop offset=".75" stop-color="#89516A"/><stop offset="1" stop-color="#59436E"/></linearGradient>
  <linearGradient id="rock" x1="165" y1="322" x2="328" y2="470" gradientUnits="userSpaceOnUse"><stop stop-color="#F4C18C"/><stop offset="1" stop-color="#A96D64"/></linearGradient>
  <linearGradient id="water" x1="250" y1="340" x2="294" y2="492" gradientUnits="userSpaceOnUse"><stop stop-color="#A6F1F0"/><stop offset=".45" stop-color="#4BC9E4"/><stop offset="1" stop-color="#3995D0"/></linearGradient>
  <linearGradient id="castle" x1="200" y1="149" x2="314" y2="287" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF4CE"/><stop offset=".58" stop-color="#FFD28A"/><stop offset="1" stop-color="#E99B66"/></linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A9A0F5"/><stop offset="1" stop-color="#6357BE"/></linearGradient>
  <radialGradient id="sunGlow" cx="0" cy="0" r="1" gradientTransform="matrix(0 88 -88 0 407 96)" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF7C5"/><stop offset="1" stop-color="#FFE08A" stop-opacity="0"/></radialGradient>
</defs>
