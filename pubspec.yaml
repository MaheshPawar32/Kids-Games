name: kidsgames
description: A premium, playful, offline-first educational games app for children.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17

  # 2D gameplay and offline game audio.
  flame: ^1.38.2
  flame_audio: ^2.12.2

  # Real-time 3D. Keep this exact until a tested migration is approved.
  flutter_scene: 0.24.3

  # Application state and navigation.
  velocity_x: ^4.3.1
  go_router: ^18.1.3

  # Offline structured storage and application directories.
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  shared_preferences: ^2.5.6
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0

  # Scene vector/matrix types.
  vector_math: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  hive_ce_generator: ^1.12.1
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/characters/
    - assets/illustrations/
    - assets/icons/
    - assets/models/characters/
    - assets/models/icons/
    - assets/models/numbers/
    - assets/models/letters/
    - assets/models/shapes/
    - assets/models/props/
    - assets/models/environments/
