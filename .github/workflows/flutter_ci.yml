name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format Dart sources and show the patch for review
        run: |
          dart format lib test
          git diff --no-color -- lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Android debug build (when platform project is committed)
        if: ${{ hashFiles('android/app/build.gradle', 'android/app/build.gradle.kts') != '' }}
        run: flutter build apk --debug
