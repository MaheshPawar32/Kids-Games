name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kids-games-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    needs: generate-baby-lion-3d
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download generated 3D asset bundle
        uses: actions/download-artifact@v4
        with:
          name: kids-games-3d-assets
          path: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format Dart sources and show the patch for review
        run: |
          dart format lib test
          git diff --no-color -- lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Generate Android platform project for validation
        if: ${{ hashFiles('android/app/build.gradle', 'android/app/build.gradle.kts') == '' }}
        run: bash tool/setup_android.sh
      - name: Verify Android application identity and Flutter GPU configuration
        run: |
          set -euxo pipefail
          grep -Eq 'applicationId.*com\\.dev\\.kidsgames' android/app/build.gradle* 
          grep -Eq 'minSdk(Version)?[[:space:]]*(=[[:space:]]*|[[:space:]]+)24' android/app/build.gradle*
          grep -q 'io.flutter.embedding.android.EnableFlutterGPU' android/app/src/main/AndroidManifest.xml
          grep -q 'android:value="true"' android/app/src/main/AndroidManifest.xml
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload generated Android project and debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-games-android-build
          path: |
            android/
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  generate-baby-lion-3d:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
          python3 -c "import numpy; print('System NumPy:', numpy.__version__)"
      - name: Generate editable Blender source and GLB
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          set -euxo pipefail
          pwd
          blender --background --python "$GITHUB_WORKSPACE/blender/scripts/create_baby_lion.py"
      - name: Generate reusable 3D icon pack
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          set -euxo pipefail
          blender --background --python "$GITHUB_WORKSPACE/blender/scripts/create_3d_icon_pack.py"
      - name: Generate educational numbers, letters, shapes, props and environments
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          set -euxo pipefail
          blender --background --python "$GITHUB_WORKSPACE/blender/scripts/create_learning_asset_library.py"
      - name: Verify generated files
        run: |
          set -euxo pipefail
          echo "Workspace: $GITHUB_WORKSPACE"
          test -s "$GITHUB_WORKSPACE/blender/output/baby_lion.blend"
          test -s "$GITHUB_WORKSPACE/assets/models/characters/baby_lion.glb"
          ICON_COUNT="$(find "$GITHUB_WORKSPACE/assets/models/icons" -maxdepth 1 -type f -name '*.glb' | wc -l)"
          echo "3D icon GLB count: $ICON_COUNT"
          test "$ICON_COUNT" -eq 13
          for file in "$GITHUB_WORKSPACE/assets/models/characters/baby_lion.glb" "$GITHUB_WORKSPACE"/assets/models/icons/*.glb; do
            test -s "$file"
            MAGIC="$(od -An -tx1 -N4 "$file" | tr -d ' \n')"
            test "$MAGIC" = "676c5446"
            ls -lh "$file"
          done
          LEARNING_COUNT="$(find "$GITHUB_WORKSPACE/assets/models"/{numbers,letters,shapes,props,environments} -maxdepth 1 -type f -name '*.glb' | wc -l)"
          echo "Learning GLB count: $LEARNING_COUNT"
          test "$LEARNING_COUNT" -eq 71
          for file in "$GITHUB_WORKSPACE"/assets/models/{numbers,letters,shapes,props,environments}/*.glb; do
            test -s "$file"
            MAGIC="$(od -An -tx1 -N4 "$file" | tr -d ' \\n')"
            test "$MAGIC" = "676c5446"
          done
          BLEND_COUNT="$(find "$GITHUB_WORKSPACE/blender/output/learning_assets" -type f -name '*.blend' | wc -l)"
          echo "Editable learning .blend count: $BLEND_COUNT"
          test "$BLEND_COUNT" -eq 71
          ls -lh "$GITHUB_WORKSPACE/blender/output/baby_lion.blend"
      - name: Upload 3D asset files
        uses: actions/upload-artifact@v4
        with:
          name: kids-games-3d-assets
          path: |
            blender/output/baby_lion.blend
            assets/models/characters/baby_lion.glb
            assets/models/icons/*.glb
            assets/models/numbers/*.glb
            assets/models/letters/*.glb
            assets/models/shapes/*.glb
            assets/models/props/*.glb
            assets/models/environments/*.glb
            blender/output/learning_assets/
          if-no-files-found: error
          retention-days: 30
