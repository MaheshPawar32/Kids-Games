name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check Dart formatting
        run: dart format lib test
      - name: Diagnostic formatted home source
        if: always()
        run: nl -ba lib/features/home/home_screen.dart | sed -n '340,420p'
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
